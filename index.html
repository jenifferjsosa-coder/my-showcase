<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的展示页</title>
<style>
:root{
  --bg:#eef1ee; --card:#fbfcfa; --ink:#14302f; --sub:#5d706e; --line:#d5ddd9;
  --main:#0f4c4a; --accent:#e8884a;
  --serif:"Noto Serif SC","Songti SC","Source Han Serif SC",serif;
  --sans:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#cfd8d4;font-family:var(--sans);color:var(--ink);display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
/* 顶部导航栏 = 小程序 navigationBar */
.nav{padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;background:var(--bg);font-family:var(--serif);font-weight:700;font-size:17px;text-align:center;border-bottom:1px solid var(--line)}
/* 页面容器 = 小程序 page */
main{flex:1;overflow-y:auto;padding:20px 18px 28px}
.page{animation:in .25s ease}
@keyframes in{from{opacity:0}to{opacity:1}}
/* 底部标签栏 = 小程序 tabBar */
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{flex:1;text-align:center;padding:10px 0 9px;font-size:12px;color:var(--sub);text-decoration:none}
.tabs a svg{display:block;margin:0 auto 3px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on{color:var(--main);font-weight:600}
.tabs a:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* 首页 */
.hero{padding:34px 4px 28px}
.hero h1{font-family:var(--serif);font-size:44px;line-height:1.15;letter-spacing:.04em;color:var(--main)}
.hero p{margin-top:14px;color:var(--sub);line-height:1.8;font-size:15px;max-width:22em}
.btn{display:inline-block;margin-top:22px;padding:12px 26px;background:var(--main);color:#fff;border-radius:999px;font-size:15px;text-decoration:none;border:0}
.h2{font-family:var(--serif);font-size:19px;margin:30px 0 12px}
.row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px}
.row .item{flex:0 0 66%}
/* 作品卡片 */
.item{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:block;text-decoration:none;color:inherit}
.cover{height:130px;display:flex;align-items:flex-end;padding:12px;font-family:var(--serif);font-size:22px;color:#fff}
.item .t{padding:12px 14px 14px}
.item b{font-size:15px}
.item span{display:block;color:var(--sub);font-size:13px;margin-top:4px;line-height:1.6}
.list{display:grid;gap:14px}
/* 关于 / 联系 */
.about p{line-height:1.9;font-size:15px;margin-bottom:14px}
.facts{margin-top:8px;border-top:1px solid var(--line)}
.facts div{display:flex;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--line);font-size:14px}
.facts em{font-style:normal;color:var(--sub)}
.contact .item{margin-bottom:12px;padding:16px;cursor:pointer}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){.page{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div class="nav" id="nav"></div>
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ====== 1. 只需要改这里：内容数据（对应小程序的 data / 云数据库） ====== */
const SITE = {
  name: "林小满",
  slogan: "独立设计师，做让人想多看两眼的小东西。",
  intro: "这里放一段自我介绍或店铺介绍。两三句话说清楚：你是谁、做什么、为什么值得联系。",
  facts: [["所在地","上海"],["从业年限","5 年"],["擅长","品牌 · 插画 · 网页"]],
  works: [
    {id:1,title:"山间咖啡馆",tag:"品牌设计",desc:"从店名到杯套的整套视觉。",color:"#0f4c4a"},
    {id:2,title:"旧书市集海报",tag:"插画",desc:"手绘字体与四色印刷。",color:"#b8602a"},
    {id:3,title:"手冲记账本",tag:"产品设计",desc:"为咖啡爱好者设计的记录工具。",color:"#3f5f8a"},
    {id:4,title:"社区花园导视",tag:"空间视觉",desc:"一套能在雨天看清的指示牌。",color:"#6b7f3a"}
  ],
  contacts: [
    {label:"微信",value:"your-wechat-id",copy:true},
    {label:"邮箱",value:"hello@example.com",copy:true},
    {label:"GitHub",value:"https://github.com/你的用户名",copy:false}
  ]
};

/* ====== 2. 页面（对应小程序 pages/ 下的各个页面） ====== */
const icon = p => `<svg viewBox="0 0 24 24">${p}</svg>`;
const PAGES = {
  home:{title:SITE.name, tab:"首页", icon:icon('<path d="M4 11l8-7 8 7v9H4z"/>'),
    render:()=>`<div class="hero"><h1>${SITE.name}</h1><p>${SITE.slogan}</p><a class="btn" href="#works">查看作品</a></div>
      <h2 class="h2">近期作品</h2>
      <div class="row">${SITE.works.slice(0,3).map(card).join("")}</div>`},
  works:{title:"作品", tab:"作品", icon:icon('<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>'),
    render:()=>`<div class="list">${SITE.works.map(card).join("")}</div>`},
  about:{title:"关于", tab:"关于", icon:icon('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'),
    render:()=>`<div class="about"><p>${SITE.intro}</p>
      <div class="facts">${SITE.facts.map(f=>`<div><em>${f[0]}</em><span>${f[1]}</span></div>`).join("")}</div></div>`},
  contact:{title:"联系", tab:"联系", icon:icon('<path d="M4 5h16v11H9l-5 4z"/>'),
    render:()=>`<div class="contact">${SITE.contacts.map((c,i)=>`<div class="item" tabindex="0" role="button" data-i="${i}"><b>${c.label}</b><span>${c.value}</span></div>`).join("")}</div>`}
};
function card(w){return `<div class="item"><div class="cover" style="background:${w.color}">${w.title}</div><div class="t"><b>${w.tag}</b><span>${w.desc}</span></div></div>`}

/* ====== 3. 极简路由（对应小程序 wx.switchTab） ====== */
const $ = id => document.getElementById(id);
function go(){
  const key = location.hash.slice(1);
  const k = PAGES[key] ? key : "home";
  const p = PAGES[k];
  document.title = p.title + " · " + SITE.name;
  $("nav").textContent = p.title;
  $("view").innerHTML = `<div class="page">${p.render()}</div>`;
  $("view").scrollTop = 0;
  $("tabs").innerHTML = Object.keys(PAGES).map(n =>
    `<a href="#${n}" class="${n===k?"on":""}">${PAGES[n].icon}${PAGES[n].tab}</a>`).join("");
}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500)}
function act(el){
  const c = SITE.contacts[el.dataset.i]; if(!c) return;
  if(!c.copy){ window.open(c.value,"_blank","noopener"); return; }
  (navigator.clipboard ? navigator.clipboard.writeText(c.value) : Promise.reject())
    .then(()=>toast("已复制"+c.label), ()=>toast(c.value));
}
$("view").addEventListener("click", e=>{const el=e.target.closest("[data-i]"); if(el) act(el)});
$("view").addEventListener("keydown", e=>{if(e.key==="Enter"){const el=e.target.closest("[data-i]"); if(el) act(el)}});
window.addEventListener("hashchange", go);
go();
</script>
</body>
</html>
