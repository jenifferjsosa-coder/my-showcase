<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c4a">
<title>我的小圈子</title>
<style>
:root{--bg:#eef1ee;--card:#fbfcfa;--ink:#14302f;--sub:#6a7c7a;--line:#dce3df;--main:#0f4c4a;--accent:#e8884a;--serif:"Noto Serif SC","Songti SC",serif;--sans:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#cdd6d2;font-family:var(--sans);color:var(--ink);display:flex;justify-content:center;font-size:15px}
button,input,textarea,select{font:inherit;color:inherit}
#app{width:100%;max-width:430px;height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.nav{display:flex;align-items:center;justify-content:center;position:relative;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;background:var(--bg);border-bottom:1px solid var(--line);font-family:var(--serif);font-weight:700;font-size:17px;transition:background .25s,border-color .25s,color .25s}
.nav.clear{background:transparent;border-color:transparent;color:#fff;position:absolute;left:0;right:0;z-index:5}
.nav .back{position:absolute;left:6px;bottom:6px;width:40px;height:40px;border:0;background:none;font-size:24px;line-height:1}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;position:relative}
.page{min-height:100%;padding:18px 16px 32px}
.page.flush{padding:0 0 32px}
.in-r{animation:inr .28s cubic-bezier(.2,.8,.2,1)}
.in-f{animation:inf .2s ease}
@keyframes inr{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes inf{from{opacity:0}to{opacity:1}}
.tabs{display:flex;align-items:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs a{flex:1;text-align:center;padding:9px 0 8px;font-size:11px;color:var(--sub);text-decoration:none;transition:color .2s}
.tabs a svg{display:block;margin:0 auto 2px;width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.tabs a.on{color:var(--main);font-weight:600}
.tabs a.on svg{transform:translateY(-2px) scale(1.08)}
.tabs a.add{flex:0 0 56px}
.tabs a.add i{display:block;width:44px;height:44px;margin:0 auto;border-radius:50%;background:var(--accent);box-shadow:0 4px 12px rgba(232,136,74,.45);position:relative;transition:transform .15s}
.tabs a.add i:active{transform:scale(.9)}
.tabs a.add i:before,.tabs a.add i:after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;transform:translate(-50%,-50%)}
.tabs a.add i:before{width:18px;height:2.5px}.tabs a.add i:after{width:2.5px;height:18px}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* 动态页 */
.cover{height:250px;background:linear-gradient(160deg,var(--main),var(--accent));position:relative}
.me-line{position:absolute;right:16px;bottom:-26px;display:flex;align-items:flex-end;gap:12px}
.me-line b{color:#fff;font-family:var(--serif);font-size:19px;padding-bottom:30px;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.av{width:56px;height:56px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--serif);font-size:22px;flex:none}
.me-line .av{width:68px;height:68px;border:3px solid var(--bg);font-size:28px}
.sign{padding:34px 16px 6px;text-align:right;color:var(--sub);font-size:13px}
.post{display:flex;gap:12px;padding:18px 16px;border-bottom:1px solid var(--line)}
.post .body{flex:1;min-width:0}
.post .name{color:var(--main);font-weight:600}
.txt{white-space:pre-wrap;word-break:break-word;line-height:1.75;margin-top:4px}
.pic{display:block;max-width:70%;max-height:260px;border-radius:8px;margin-top:8px}
.meta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;color:var(--sub);font-size:12px}
.meta .ops{display:flex;gap:4px}
.ops button{border:0;background:none;color:var(--sub);padding:6px 8px;border-radius:8px;font-size:13px}
.ops button.liked{color:#d6463f}
.ops .heart{display:inline-block}
.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.5)}100%{transform:scale(1)}}
.cm{background:#e4eae6;border-radius:8px;margin-top:8px;padding:6px 10px;font-size:14px;line-height:1.7}
.cm b{color:var(--main);font-weight:600}
.cmf{display:flex;gap:8px;margin-top:8px}
.cmf input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:16px}
.btn{border:0;background:var(--main);color:#fff;border-radius:999px;padding:9px 20px;transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.sm{padding:7px 14px;font-size:14px}
.empty{padding:60px 20px;text-align:center;color:var(--sub);line-height:1.8}
/* 吧 */
.bar{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;text-decoration:none;color:inherit;transition:transform .15s}
.bar:active{transform:scale(.98)}
.bar .av{width:48px;height:48px;border-radius:12px}
.bar small,.th small{display:block;color:var(--sub);font-size:12px;margin-top:3px}
.th{display:block;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;background:var(--card)}
.th b{display:block;line-height:1.5}
.th p{color:var(--sub);font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.barhd{padding:16px;background:var(--main);color:#fff}
.barhd h2{font-family:var(--serif);font-size:20px}
.barhd p{opacity:.8;font-size:13px;margin-top:4px}
.floor{padding:16px;border-bottom:1px solid var(--line);background:var(--card)}
.floor .hd{display:flex;justify-content:space-between;color:var(--sub);font-size:12px;margin-bottom:6px}
.floor .hd b{color:var(--main);font-size:14px}
.reply{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
.reply input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;padding:9px 14px;background:#fff;font-size:16px}
.fab{position:fixed}
/* 发布 */
.seg{display:flex;background:#dfe6e2;border-radius:999px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:999px;transition:background .2s}
.seg button.on{background:var(--card);font-weight:600}
.f{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:16px;margin-bottom:10px;display:block}
textarea.f{min-height:140px;resize:none;line-height:1.7}
.row{display:flex;align-items:center;gap:12px;margin-top:4px}
.add-img{border:1px dashed var(--sub);background:none;border-radius:10px;padding:9px 14px;color:var(--sub)}
.prev{width:56px;height:56px;border-radius:8px;object-fit:cover}
.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.sl{flex:0 0 86%;scroll-snap-align:center;height:200px;border-radius:18px;color:#fff;padding:18px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;cursor:pointer;transition:transform .25s}
.sl:active{transform:scale(.97)}
.sl:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.5))}
.sl>*{position:relative;z-index:2}.sl img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.sl b{font-family:var(--serif);font-size:24px}.sl span{opacity:.9;font-size:13px;margin-top:4px}
.dots{display:flex;justify-content:center;gap:6px;margin:-2px 0 12px}
.dots i{width:6px;height:6px;border-radius:3px;background:#b9c6c1;transition:all .25s}.dots i.on{width:18px;background:var(--main)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;transition:all .2s}
.chip.on{background:var(--main);color:#fff;border-color:var(--main)}
.mas{columns:2;column-gap:12px;padding:0 16px}
.w{break-inside:avoid;margin-bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .15s}
.w:active{transform:scale(.97)}
.w .cv{display:flex;align-items:flex-end;padding:10px;color:#fff;font-family:var(--serif);font-size:17px}
.w img{display:block;width:100%}
.w .t{padding:9px 11px 11px;font-size:12px;color:var(--sub)}.w .t b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini{position:relative;height:100px;border-radius:10px;overflow:hidden;display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:12px;cursor:pointer}
.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.mini span{position:relative}
.stats{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;margin:18px 0 14px}
.stats div{flex:1;text-align:center;padding:14px 0}.stats b{display:block;font-family:var(--serif);font-size:22px;color:var(--main)}.stats span{font-size:12px;color:var(--sub)}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px var(--line);transition:transform .2s,box-shadow .2s}
.sw.on{box-shadow:0 0 0 2px var(--ink);transform:scale(1.12)}
#sheet{position:absolute;inset:0;z-index:20;pointer-events:none}#sheet.on{pointer-events:auto}
.mask{position:absolute;inset:0;background:rgba(10,30,28,.5);opacity:0;transition:opacity .25s}#sheet.on .mask{opacity:1}
.pane{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
#sheet.on .pane{transform:none}
.pane .big{display:flex;align-items:flex-end;height:210px;padding:18px;color:#fff;font-family:var(--serif);font-size:26px}
.pane img.big{display:block;width:100%;height:auto;max-height:340px;object-fit:cover;padding:0}.pane .in{padding:16px}
.btn[disabled]{opacity:.5}
.pcard{display:flex;justify-content:space-between;align-items:flex-end;background:var(--main);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px}
.pcard b{display:block;font-family:var(--serif);font-size:42px;line-height:1.1}.pcard small{display:block;opacity:.8;font-size:12px}.pcard div:last-child{text-align:right}
.wk{display:flex;gap:8px;margin:0 0 16px}
.wk i{flex:1;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;color:var(--sub);transition:background .3s}
.wk i.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tk{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14px}
.tk small{display:block;color:var(--sub);font-size:12px;margin-top:2px}.tk.ok span{color:var(--main);font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="nav" id="nav"></div>
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
  <div id="sheet"></div>
  <div class="toast" id="toast"></div>
</div>
<script>
/* ===== 配置：改这里 ===== */
const CFG = {
  name: "林小满", sign: "把日子过成作品。",
  bars: [
    {id:"life", name:"日常吧", desc:"今天吃了什么、看到了什么", c:"#2f7f73"},
    {id:"work", name:"作品吧", desc:"作品讨论，欢迎拍砖", c:"#b8602a"},
    {id:"chat", name:"闲聊吧", desc:"什么都能聊", c:"#3f5f8a"}
  ]
};
const KEY = "msite.v2", H = 3600e3, $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS = ["#0f4c4a","#b8602a","#3f5f8a","#6b7f3a","#8a4f7d","#c0453a"];
const col = s => COLORS[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const av = (n, c) => `<div class="av" style="background:${c || col(n)}">${esc([...n][0] || "?")}</div>`;

/* ===== 数据（存在浏览器 localStorage，换成小程序时改成云数据库） ===== */
const now = Date.now();
const seed = () => ({
  id: 10, theme: 0, users: {}, cur: null,
  works: [
    {id:5,title:"山间咖啡馆",tag:"品牌设计",desc:"从店名到杯套的整套视觉，用山和咖啡豆的剪影做主图形。",c:"#0f4c4a",h:200,t:now-72*H,n:12,liked:false,fav:false},
    {id:6,title:"旧书市集海报",tag:"插画",desc:"手绘字体加四色印刷。",c:"#b8602a",h:150,t:now-96*H,n:8,liked:false,fav:false},
    {id:7,title:"手冲记账本",tag:"产品设计",desc:"为咖啡爱好者设计的记录工具。",c:"#3f5f8a",h:170,t:now-120*H,n:5,liked:false,fav:false},
    {id:8,title:"社区花园导视",tag:"空间视觉",desc:"一套雨天也能看清的指示牌。",c:"#6b7f3a",h:210,t:now-150*H,n:9,liked:false,fav:false},
    {id:9,title:"夜航插画系列",tag:"插画",desc:"六张关于夜晚交通的插画。",c:"#8a4f7d",h:160,t:now-200*H,n:15,liked:false,fav:false},
    {id:10,title:"潮汐茶饮包装",tag:"品牌设计",desc:"随潮汐变色的瓶标。",c:"#2f7f73",h:190,t:now-240*H,n:4,liked:false,fav:false}
  ],
  posts: [
    {id: 1, text: "这个小站上线了。以后作品、日常都先发在这里，也欢迎在“吧”里留言。", t: now - 2 * H, liked: false, n: 3, cm: [{u: "阿木", x: "恭喜！"}]},
    {id: 2, text: "雨天的咖啡馆，适合改稿。", t: now - 26 * H, liked: true, n: 6, cm: []}
  ],
  threads: [
    {id: 3, bar: "life", title: "大家周末一般去哪里逛？", text: "想找个安静的地方画画，求推荐。", u: "阿木", t: now - 5 * H, rp: [{u: "小满", x: "附近的旧书店不错，人少。", t: now - 4 * H}]},
    {id: 4, bar: "work", title: "新海报的配色，你更喜欢哪版？", text: "一版偏暖，一版偏冷，等你们投票。", u: "小满", t: now - 30 * H, rp: []}
  ]
});
let db;
try { db = JSON.parse(localStorage.getItem(KEY)) } catch (e) {}
if (!db || !db.posts) db = seed();
if (!db.works) db.works = seed().works;
if (db.theme == null) db.theme = 0;
if (!db.users) { db.users = {}; db.cur = null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)) } catch (e) { toast("存储空间不足，图片可能没存上") } }
const ago = t => { const m = (Date.now() - t) / 6e4; return m < 1 ? "刚刚" : m < 60 ? Math.floor(m) + " 分钟前" : m < 1440 ? Math.floor(m / 60) + " 小时前" : Math.floor(m / 1440) + " 天前" };
let ui = {open: null, mode: "post", bar: "life", img: "", tag: "全部", f: "all", sort: "new", mt: "pts", sheet: null};
const TASKS = [["signin","每日签到",2,1],["cmt","评论或回复",2,3],["like","点赞",1,5],["share","分享页面",3,1],["post","发布内容",5,2]];
const LV = ["新朋友","常客","熟人","老友","知己"];
const dstr = (off = 0) => new Date(Date.now() - off * 864e5).toLocaleDateString("sv");
const U = () => db.users[db.cur] || null, who = () => db.cur || "游客";
const day = u => { if (u.day !== dstr()) { u.day = dstr(); u.done = {}; } return u; };
function earn(k) {
  const u = U(); if (!u) return; day(u);
  const T = TASKS.find(t => t[0] === k), n = u.done[k] || 0; if (n >= T[3]) return;
  u.done[k] = n + 1; let p = T[2], note = T[1];
  if (k === "signin") { u.streak = u.last === dstr(1) ? u.streak + 1 : 1; u.last = dstr(); if (u.streak % 7 === 0) { p += 10; note += "（连续7天奖励）"; } }
  u.pts += p; u.log.unshift({t: Date.now(), x: note, p}); u.log.length = Math.min(u.log.length, 30); save(); toast("+" + p + " 积分 · " + T[1]); if (route().k === "me") render(1);
}
function ptsHTML() {
  const u = U();
  if (!u) return `<div class="cm" style="margin:0 0 14px;line-height:1.8">登录后可以签到、做任务、攒积分。<br>目前账号只保存在这台设备的浏览器里。</div><input class="f" id="ln" maxlength="12" placeholder="取个昵称"><button class="btn" data-a="login">登录 / 注册</button>`;
  day(u);
  const lv = Math.floor(u.pts / 50) + 1, signed = !!u.done.signin, alive = u.last === dstr() || u.last === dstr(1), fill = alive ? (u.streak - 1) % 7 + 1 : 0;
  return `<div class="pcard"><div><small>当前积分</small><b data-to="${u.pts}">${u.pts}</b></div><div>Lv.${lv} ${LV[Math.min(lv - 1, 4)]}<small>距下一级还差 ${50 - u.pts % 50} 分</small></div></div>
  <button class="btn" style="width:100%;margin:0 0 14px" data-a="signin" ${signed ? "disabled" : ""}>${signed ? "今天已签到" : "签到 +2"}</button>
  <div class="wk" aria-label="连续签到">${[1,2,3,4,5,6,7].map(i => `<i class="${i <= fill ? "on" : ""}">${i === 7 ? "+10" : i}</i>`).join("")}</div>
  <div style="font-family:var(--serif);font-size:17px;margin:4px 0 4px">今日任务</div>
  ${TASKS.map(t => { const d = u.done[t[0]] || 0; return `<div class="tk ${d >= t[3] ? "ok" : ""}"><div>${t[1]}<small>+${t[2]} 积分 · 每天最多 ${t[3]} 次</small></div><span>${d >= t[3] ? "已完成" : d + "/" + t[3]}</span></div>`; }).join("")}
  <div class="row" style="margin:12px 0 0"><button class="btn sm" data-a="share">分享本页 +3</button><button class="btn sm" style="background:none;color:var(--sub)" data-a="logout">退出 ${esc(db.cur)}</button></div>
  ${u.log.length ? `<div style="font-family:var(--serif);font-size:17px;margin:22px 0 4px">积分记录</div>` + u.log.slice(0, 6).map(l => `<div class="tk"><div>${esc(l.x)}<small>${ago(l.t)}</small></div><span>+${l.p}</span></div>`).join("") : ""}`;
}
const THEMES = [["#0f4c4a","#e8884a"],["#3f4a8a","#e0607a"],["#7a3b2e","#d9a441"],["#2d5f3f","#e07b39"],["#4a3a6b","#3ba99c"],["#1f2a33","#e05a47"]];
const chipsHTML = (l, cur, a) => `<div class="chips">${l.map(([k, t]) => `<button class="chip ${k === cur ? "on" : ""}" data-a="${a}" data-id="${esc(k)}">${esc(t)}</button>`).join("")}</div>`;
const feedList = () => db.posts.filter(p => ui.f === "all" || (ui.f === "img" ? p.img : !p.img)).sort((a, b) => b.t - a.t);

/* ===== 页面 ===== */
const ICON = {
  home: '<path d="M4 11l8-7 8 7v9H4z"/>',
  feed: '<path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 11c0 5.500-7 10-7 10z"/>',
  bars: '<path d="M4 5h16v11H9l-5 4z"/>',
  me: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'
};
const tab = (k, n) => `<a href="#${k}" class="${route().k === k || (k === "bars" && /^(bar|t)$/.test(route().k)) ? "on" : ""}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${n}</a>`;

function postHTML(p) {
  const cms = p.cm.map(c => `<div class="cm"><b>${esc(c.u)}</b>：${esc(c.x)}</div>`).join("");
  return `<article class="post">${av(CFG.name)}<div class="body"><div class="name">${esc(CFG.name)}</div>
    <div class="txt">${esc(p.text)}</div>${p.img ? `<img class="pic" src="${p.img}" alt="">` : ""}
    <div class="meta"><span>${ago(p.t)}</span><span class="ops">
      <button data-a="like" data-id="${p.id}" class="${p.liked ? "liked" : ""}"><span class="heart">${p.liked ? "♥" : "♡"}</span> ${p.n || ""}</button>
      <button data-a="cmt" data-id="${p.id}">评论</button><button data-a="del" data-id="${p.id}">删除</button></span></div>
    ${cms}${ui.open === p.id ? `<div class="cmf"><input id="ci" maxlength="100" placeholder="说点什么…"><button class="btn sm" data-a="send" data-id="${p.id}">发送</button></div>` : ""}
  </div></article>`;
}
const VIEWS = {
  home: () => {
    const tags = ["全部", ...new Set(db.works.map(w => w.tag))];
    if (!tags.includes(ui.tag)) ui.tag = "全部";
    const top = [...db.works].sort((a, b) => b.n - a.n).slice(0, 3);
    const list = db.works.filter(w => ui.tag === "全部" || w.tag === ui.tag).sort((a, b) => b.t - a.t);
    return {nav: CFG.name, flush: true, html:
      `<div style="padding:20px 16px 0;font-family:var(--serif);font-size:22px;line-height:1.6">${esc(CFG.sign)}</div>` +
      (top.length ? `<div class="car">${top.map(w => `<div class="sl" tabindex="0" style="background:${w.c}" data-a="openw" data-id="${w.id}">${w.img ? `<img src="${w.img}" alt="">` : ""}<b>${esc(w.title)}</b><span>${esc(w.tag)} · ♥ ${w.n}</span></div>`).join("")}</div><div class="dots">${top.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : "") +
      chipsHTML(tags.map(t => [t, t]), ui.tag, "ftag") +
      (list.length ? `<div class="mas">${list.map(w => `<div class="w" tabindex="0" data-a="openw" data-id="${w.id}">${w.img ? `<img src="${w.img}" alt="">` : `<div class="cv" style="background:${w.c};height:${w.h || 160}px">${esc(w.title)}</div>`}<div class="t"><b>${esc(w.title)}</b>${esc(w.tag)} · ♥ ${w.n}</div></div>`).join("")}</div>` : `<div class="empty">还没有作品。<br>点下面的加号，选“作品”来添加。</div>`)};
  },
  feed: () => ({nav: "", clear: true, flush: true, html:
    `<div class="cover"></div><div class="me-line"><b>${esc(CFG.name)}</b>${av(CFG.name, "var(--accent)")}</div>
     <div class="sign">${esc(CFG.sign)}</div>` +
    chipsHTML([["all","全部"],["img","有图"],["txt","纯文字"]], ui.f, "ff") + (feedList().length ? feedList().map(postHTML).join("") : `<div class="empty">还没有动态。<br>点下面的加号发第一条。</div>`)}),
  bars: () => ({nav: "吧", html: CFG.bars.map(b => {
    const n = db.threads.filter(t => t.bar === b.id).length;
    return `<a class="bar" href="#bar/${b.id}">${av(b.name, b.c)}<div><b>${esc(b.name)}</b><small>${esc(b.desc)} · ${n} 个帖子</small></div></a>`;
  }).join("")}),
  bar: id => { const b = CFG.bars.find(x => x.id === id) || CFG.bars[0];
    const ts = db.threads.filter(t => t.bar === b.id).sort((a, c) => ui.sort === "hot" ? c.rp.length - a.rp.length : c.t - a.t);
    return {nav: b.name, back: "#bars", flush: true, html:
      `<div class="barhd"><h2>${esc(b.name)}</h2><p>${esc(b.desc)}</p><div style="margin-top:10px"><button class="btn sm" style="background:var(--accent)" data-a="newt" data-id="${b.id}">发帖</button></div></div>` +
      chipsHTML([["new","最新"],["hot","最热"]], ui.sort, "sort").replace('class="chips"', 'class="chips" style="padding:12px 16px 8px"') + (ts.length ? ts.map(t => `<a class="th" href="#t/${t.id}"><b>${esc(t.title)}</b><p>${esc(t.text)}</p><small>${esc(t.u)} · ${ago(t.t)} · ${t.rp.length} 回复</small></a>`).join("") : `<div class="empty">这个吧还没有帖子。<br>来发第一帖。</div>`)}; },
  t: id => { const t = db.threads.find(x => x.id == id);
    if (!t) return {nav: "帖子", back: "#bars", html: `<div class="empty">帖子不存在或已被删除。</div>`};
    const fl = (u, x, tm, n) => `<div class="floor"><div class="hd"><b>${esc(u)}</b><span>${n} · ${ago(tm)}</span></div><div class="txt">${esc(x)}</div></div>`;
    return {nav: "帖子", back: "#bar/" + t.bar, flush: true, html:
      `<div class="floor"><div class="txt" style="font-family:var(--serif);font-size:18px;font-weight:700;margin:0 0 8px">${esc(t.title)}</div></div>` +
      fl(t.u, t.text, t.t, "楼主") + t.rp.map((r, i) => fl(r.u, r.x, r.t, (i + 2) + " 楼")).join("") +
      `<div class="reply"><input id="ri" maxlength="200" placeholder="回复楼主…"><button class="btn sm" data-a="reply" data-id="${t.id}">回复</button></div>`}; },
  compose: () => {
    const m = ui.mode, M = [["post","动态"],["work","作品"],["thread","发帖到吧"]];
    return {nav: "发布", html: `<div class="seg">${M.map(([k, l]) => `<button data-a="mode" data-id="${k}" class="${m === k ? "on" : ""}">${l}</button>`).join("")}</div>
    ${m === "thread" ? `<select class="f" id="cb">${CFG.bars.map(b => `<option value="${b.id}" ${ui.bar === b.id ? "selected" : ""}>${esc(b.name)}</option>`).join("")}</select><input class="f" id="ct" maxlength="40" placeholder="标题">` : ""}
    ${m === "work" ? `<input class="f" id="cw" maxlength="20" placeholder="作品名称"><input class="f" id="cg" maxlength="8" placeholder="分类，如 插画（相同分类会归为一组）">` : ""}
    <textarea class="f" id="cx" maxlength="500" placeholder="${m === "post" ? "这一刻的想法…" : m === "work" ? "作品介绍（可不写）" : "正文"}"></textarea>
    <div class="row">${m !== "thread" ? `<button class="add-img" data-a="pick">添加图片</button><input type="file" id="cf" accept="image/*" hidden>${ui.img ? `<img class="prev" src="${ui.img}" alt="">` : ""}` : ""}
    <button class="btn" style="margin-left:auto" data-a="pub">发布</button></div>`};
  },
  me: () => {
    const likes = db.works.reduce((a, w) => a + w.n, 0) + db.posts.reduce((a, p) => a + (p.n || 0), 0);
    const st = (n, l) => `<div><b data-to="${n}">${n}</b><span>${l}</span></div>`;
    const grid = ws => ws.length ? `<div class="g3">${ws.map(w => `<div class="mini" tabindex="0" style="background:${w.c}" data-a="openw" data-id="${w.id}">${w.img ? `<img src="${w.img}" alt="">` : ""}<span>${esc(w.title)}</span></div>`).join("")}</div>` : `<div class="empty">这里还没有内容。<br>在作品页点开一个作品，可以收藏它。</div>`;
    const body = ui.mt === "pts" ? ptsHTML() : ui.mt === "works" ? grid(db.works) : ui.mt === "fav" ? grid(db.works.filter(w => w.fav)) :
      `<div class="cm" style="margin:0 0 14px">主题色</div><div class="row" style="margin:0 0 20px">${THEMES.map((t, i) => `<button class="sw ${db.theme === i ? "on" : ""}" style="background:linear-gradient(135deg,${t[0]} 50%,${t[1]} 50%)" data-a="theme" data-id="${i}" aria-label="主题${i + 1}"></button>`).join("")}</div><div class="cm">内容保存在这台设备的浏览器里，换设备会丢。</div><div class="row" style="margin-top:16px"><button class="btn sm" data-a="export">导出数据</button><button class="btn sm" style="background:#b34a42" data-a="reset">清空并恢复示例</button></div>`;
    return {nav: "我的", html: `<div style="display:flex;gap:14px;align-items:center">${av(who(), "var(--accent)")}<div><b style="font-family:var(--serif);font-size:19px">${esc(who())}</b><div style="color:var(--sub);font-size:13px;margin-top:4px">${U() ? "Lv." + (Math.floor(U().pts / 50) + 1) + " · " + U().pts + " 积分" : "登录后开始攒积分"}</div></div></div><div class="stats">${st(db.works.length, "作品")}${st(db.posts.length, "动态")}${st(db.threads.length, "帖子")}${st(likes, "获赞")}</div>` + chipsHTML([["pts","积分"],["works","作品"],["fav","收藏"],["set","设置"]], ui.mt, "mt").replace('class="chips"', 'class="chips" style="padding:0 0 12px"') + body};
  }
};

/* ===== 路由与渲染 ===== */
function route() { const [k, id] = (location.hash.slice(1) || "home").split("/"); return {k: VIEWS[k] ? k : "home", id}; }
let lastDepth = 0;
function render(keep) {
  if (!keep && ui.sheet != null) ACT.closew();
  const {k, id} = route(), v = VIEWS[k](id), depth = k === "t" ? 2 : k === "bar" ? 1 : 0, view = $("view"), top = view.scrollTop;
  const nav = $("nav"); nav.className = "nav" + (v.clear ? " clear" : "");
  nav.innerHTML = (v.back ? `<button class="back" aria-label="返回" onclick="location.hash='${v.back}'">‹</button>` : "") + esc(v.nav);
  view.innerHTML = `<div class="page ${v.flush ? "flush" : ""} ${keep ? "" : depth > lastDepth ? "in-r" : "in-f"}">${v.html}</div>`;
  view.scrollTop = keep ? top : 0; lastDepth = depth;
  $("tabs").innerHTML = tab("home", "作品") + tab("feed", "动态") + `<a href="#compose" class="add" aria-label="发布"><i></i></a>` + tab("bars", "吧") + tab("me", "我的");
  if (!keep) countUp();
  if (ui.open && k === "feed") { const i = $("ci"); i && i.focus({preventScroll: true}); }
}
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 1600); }
function shrink(file, cb) { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, 720 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = im.width * s; c.height = im.height * s; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL("image/jpeg", .72)) }; im.src = r.result }; r.readAsDataURL(file); }

function applyTheme() { const t = THEMES[db.theme] || THEMES[0], r = document.documentElement.style; r.setProperty("--main", t[0]); r.setProperty("--accent", t[1]); document.querySelector("meta[name=theme-color]").content = t[0]; }
function countUp() { document.querySelectorAll("[data-to]").forEach(el => { const to = +el.dataset.to, t0 = performance.now(); (function f(t) { const k = Math.min(1, (t - t0) / 700); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); })(t0); }); }
function drawSheet(open) {
  const w = db.works.find(x => x.id === ui.sheet), s = $("sheet"); if (!w) return;
  s.innerHTML = `<div class="mask" data-a="closew"></div><div class="pane" role="dialog" aria-label="${esc(w.title)}">${w.img ? `<img class="big" src="${w.img}" alt="">` : `<div class="big" style="background:${w.c}">${esc(w.title)}</div>`}<div class="in"><b style="font-family:var(--serif);font-size:19px">${esc(w.title)}</b><div class="meta"><span>${esc(w.tag)} · ${ago(w.t)}</span></div><div class="txt">${esc(w.desc || "暂无介绍")}</div><div class="row" style="margin-top:16px"><button class="btn sm" data-a="wlike" data-id="${w.id}">${w.liked ? "♥ 已赞" : "♡ 点赞"} ${w.n || ""}</button><button class="btn sm" style="background:var(--accent)" data-a="wfav" data-id="${w.id}">${w.fav ? "已收藏" : "收藏"}</button><button class="btn sm" style="background:none;color:var(--sub)" data-a="delw" data-id="${w.id}">删除</button><button class="btn sm" style="background:none;color:var(--sub)" data-a="share">分享</button></div></div></div>`;
  if (open) requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add("on")));
}
const ACT = {
  login() { const n = $("ln").value.trim().slice(0, 12); if (!n) return toast("请输入昵称"); if (n === CFG.name) return toast("这个昵称已被占用"); if (!db.users[n]) db.users[n] = {pts: 0, streak: 0, last: "", day: "", done: {}, log: []}; db.cur = n; save(); render(1); toast("欢迎，" + n); },
  logout() { db.cur = null; save(); render(1); },
  signin() { const u = U(); if (!u) return; day(u); if (u.done.signin) return toast("今天已经签到了"); earn("signin"); render(1); },
  async share() { const url = location.href.split("#")[0]; try { if (navigator.share) await navigator.share({title: CFG.name + " 的小站", url}); else { await navigator.clipboard.writeText(url); toast("链接已复制"); } earn("share"); } catch (e) {} },
  openw(id) { ui.sheet = +id; drawSheet(true); },
  closew() { ui.sheet = null; $("sheet").classList.remove("on"); },
  wlike(id) { const w = db.works.find(x => x.id == id); w.liked = !w.liked; w.n = Math.max(0, w.n + (w.liked ? 1 : -1)); save(); drawSheet(); render(1); if (w.liked) earn("like"); },
  wfav(id) { const w = db.works.find(x => x.id == id); w.fav = !w.fav; save(); drawSheet(); render(1); toast(w.fav ? "已收藏" : "已取消收藏"); },
  delw(id) { if (confirm("删除这个作品？")) { db.works = db.works.filter(w => w.id != id); save(); ACT.closew(); render(1); } },
  ftag(id) { ui.tag = id; render(1); }, ff(id) { ui.f = id; render(1); }, sort(id) { ui.sort = id; render(1); }, mt(id) { ui.mt = id; render(1); },
  theme(id) { db.theme = +id; save(); applyTheme(); render(1); },
  like(id) { const p = db.posts.find(x => x.id == id); p.liked = !p.liked; p.n = Math.max(0, (p.n || 0) + (p.liked ? 1 : -1)); save(); render(1); if (p.liked) { earn("like"); const h = document.querySelector(`[data-a=like][data-id="${id}"] .heart`); h && h.classList.add("pop"); } },
  cmt(id) { ui.open = ui.open == id ? null : +id; render(1); },
  send(id) { const x = $("ci").value.trim(); if (!x) return toast("先写点内容"); db.posts.find(p => p.id == id).cm.push({u: who(), x}); ui.open = null; save(); render(1); earn("cmt"); },
  del(id) { if (confirm("删除这条动态？")) { db.posts = db.posts.filter(p => p.id != id); save(); render(1); } },
  newt(id) { ui.mode = "thread"; ui.bar = id; location.hash = "#compose"; },
  mode(m) { const x = $("cx"), v = x ? x.value : ""; ui.mode = m; ui.img = ""; render(1); $("cx").value = v; },
  pick() { $("cf").click(); },
  pub() {
    const x = $("cx").value.trim(), m = ui.mode;
    if (m === "post") { if (!x) return toast("正文不能为空"); db.posts.push({id: ++db.id, text: x, img: ui.img, t: Date.now(), liked: false, n: 0, cm: []}); ui.img = ""; save(); earn("post"); location.hash = "#feed"; }
    else if (m === "work") { const ti = $("cw").value.trim(); if (!ti) return toast("请填写作品名称"); db.works.push({id: ++db.id, title: ti, tag: $("cg").value.trim() || "未分类", desc: x, c: col(ti), h: 150 + (ti.length * 37) % 90, img: ui.img, t: Date.now(), n: 0, liked: false, fav: false}); ui.img = ""; ui.tag = "全部"; save(); earn("post"); location.hash = "#home"; }
    else { const ti = $("ct").value.trim(); if (!x) return toast("正文不能为空"); if (!ti) return toast("请填写标题"); const b = $("cb").value; db.threads.push({id: ++db.id, bar: b, title: ti, text: x, u: who(), t: Date.now(), rp: []}); save(); earn("post"); location.hash = "#bar/" + b; }
    toast("已发布");
  },
  reply(id) { const x = $("ri").value.trim(); if (!x) return toast("先写点内容"); db.threads.find(t => t.id == id).rp.push({u: who(), x, t: Date.now()}); save(); render(1); earn("cmt"); const v = $("view"); v.scrollTop = v.scrollHeight; },
  export() { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 1)], {type: "application/json"})); a.download = "my-site-data.json"; a.click(); },
  reset() { if (confirm("会清空所有内容，确定吗？")) { db = seed(); save(); applyTheme(); render(); toast("已恢复示例"); } }
};
document.addEventListener("click", e => { const b = e.target.closest("[data-a]"); if (b && ACT[b.dataset.a]) ACT[b.dataset.a](b.dataset.id); });
document.addEventListener("change", e => { if (e.target.id === "cf" && e.target.files[0]) shrink(e.target.files[0], d => { ui.img = d; const t = $("cx").value; render(1); $("cx").value = t; }); });
document.addEventListener("keydown", e => { if (e.key !== "Enter") return; const m = {ci: "send", ri: "reply", ln: "login"}[e.target.id]; if (m) ACT[m](m === "send" ? ui.open : route().id); });
document.addEventListener("keydown", e => { if (e.key === "Escape") ACT.closew(); else if (e.key === "Enter" && e.target.matches && e.target.matches(".w[data-a],.mini[data-a],.sl[data-a]")) e.target.click(); });
document.addEventListener("scroll", e => { const c = e.target; if (c.classList && c.classList.contains("car")) { const i = Math.round(c.scrollLeft / (c.children[0].offsetWidth + 12)); c.nextElementSibling.querySelectorAll("i").forEach((d, j) => d.classList.toggle("on", j === i)); } }, true);
window.addEventListener("hashchange", () => render());
applyTheme();
render();
</script>
</body>
</html>
